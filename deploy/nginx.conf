server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The standard table already maps .wasm. (A bare `types { ... }` block would replace the whole table.)
  include /etc/nginx/mime.types;
  gzip on;
  gzip_comp_level 6;
  gzip_types application/wasm application/javascript text/css image/svg+xml application/json;

  location / {
    include /etc/nginx/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  # Build output changes with every deploy: let the browser revalidate.
  location ~* \.(wasm|js|css)$ {
    include /etc/nginx/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
}
