# Response headers, included in every location (an add_header inside a location
# hides the ones from the server block, so they live in one file).
#
# Cross-origin isolation (COOP and COEP) gives the browser a finer clock:
# performance.now() resolves about 5 microseconds instead of 100 or more, and
# the playground times probes of 50 to 500 nanoseconds.
#
# The playground runs the visitor's own JavaScript (the workload script) with
# new Function, so script-src needs 'unsafe-eval'. connect-src 'self' keeps that
# script, including one that arrives through a shared link, from sending
# anything anywhere.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
